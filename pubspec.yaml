name: entrenaop
description: "App de entrenamiento personal y preparación de oposiciones militares"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Navegación
  go_router: ^14.0.0

  # Inyección de dependencias
  get_it: ^7.6.8

  # Supabase
  supabase_flutter: ^2.5.0

  # Video
  video_player: ^2.8.6

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true